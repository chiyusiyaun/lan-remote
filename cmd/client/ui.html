<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>LAN Remote Client</title>
<style>
:root{
  --bg:#0f1115; --panel:#171a21; --panel2:#1c212b; --line:#2a2f3a;
  --text:#e8eaef; --muted:#8b93a7; --accent:#4f8cff; --ok:#3dd68c; --bad:#ff5f6d;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  overflow:hidden;user-select:none}
#app{height:100%;display:flex;flex-direction:column}
.hidden{display:none!important}
.bar{display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
.brand{font-weight:700;font-size:15px}
.brand span{color:var(--accent)}
.status{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--bad)}
.dot.on{background:var(--ok)}
.spacer{flex:1}
.btn{border:1px solid var(--line);background:#1f2430;color:var(--text);border-radius:10px;padding:8px 14px;font-size:13px;cursor:pointer}
.btn:hover{border-color:#3a4254}
.btn.primary{background:var(--accent);border-color:transparent;color:#fff;font-weight:600}
.btn.danger{background:#3a1f24;border-color:#5a2a32;color:#ff8a95}
.screen{flex:1;overflow:auto;display:none;flex-direction:column}
.screen.active{display:flex}
.home-body{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:14px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px}
.panel h2{margin:0 0 12px;font-size:14px;color:var(--muted);font-weight:600}
.peer-list{display:flex;flex-direction:column;gap:8px}
.peer{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--panel2);border:1px solid var(--line);border-radius:12px;cursor:pointer}
.peer:hover{border-color:var(--accent)}
.peer .avatar{width:40px;height:40px;border-radius:10px;background:#2a3348;color:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:700}
.peer .meta{flex:1;min-width:0}
.peer .name{font-size:14px;font-weight:600}
.peer .addr{font-size:12px;color:var(--muted);margin-top:2px}
.empty{padding:28px;text-align:center;color:var(--muted);font-size:13px;border:1px dashed var(--line);border-radius:12px}
#stage{flex:1;position:relative;display:flex;align-items:center;justify-content:center;background:#000;overflow:hidden;touch-action:none}
#screen{display:block;max-width:100%;max-height:100%;width:auto;height:auto;cursor:crosshair}
.dock{display:flex;gap:8px;padding:10px 12px;background:var(--panel);border-top:1px solid var(--line);overflow-x:auto}
#mouseBtns{position:absolute;right:10px;bottom:10px;display:none;flex-direction:column;gap:8px;z-index:5}
#mouseBtns .btn{width:48px;height:48px;border-radius:50%;padding:0}
body.touch #mouseBtns{display:flex}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:20}
.overlay.hidden{display:none}
.sheet{width:min(420px,calc(100% - 24px));background:var(--panel);border-radius:16px;padding:20px;border:1px solid var(--line)}
.sheet h2{margin:0 0 14px;font-size:17px}
.field{margin-bottom:12px}
.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}
.field input{width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:#12151c;color:var(--text);font-size:16px}
.actions{display:flex;gap:10px;margin-top:8px}
.actions .btn{flex:1;text-align:center}
#keypad{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:8px}
#kbInput{width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:#12151c;color:var(--text);font-size:16px;resize:none}
.toast{position:fixed;left:50%;top:14%;transform:translateX(-50%);background:rgba(20,24,32,.94);border:1px solid var(--line);padding:10px 14px;border-radius:10px;font-size:13px;z-index:50;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
</style>
</head>
<body>
<div id="app">
  <div id="screenHome" class="screen active">
    <div class="bar">
      <div class="brand">LAN Remote <span>Client</span></div>
      <div class="status"><span class="dot" id="hubDot"></span><span id="hubTxt">连接注册中心…</span></div>
      <div class="spacer"></div>
      <button class="btn" id="btnRefresh">刷新</button>
      <button class="btn" id="btnManual">手动连接</button>
    </div>
    <div class="home-body">
      <div class="panel">
        <h2>在线设备（选择要控制的）</h2>
        <div id="peerList" class="peer-list">
          <div class="empty">正在从注册中心拉取…</div>
        </div>
      </div>
    </div>
  </div>

  <div id="screenRemote" class="screen">
    <div class="bar">
      <button class="btn" id="btnBack">← 返回</button>
      <div class="brand" id="remoteTitle">远程桌面</div>
      <div class="status"><span class="dot" id="remoteDot"></span><span id="remoteStxt">未连接</span></div>
      <div class="spacer"></div>
      <button class="btn" id="btnKeys">键盘</button>
      <button class="btn danger" id="btnDisc">断开</button>
    </div>
    <div id="stage">
      <canvas id="screen" width="16" height="9"></canvas>
      <div id="mouseBtns">
        <button class="btn" data-btn="left">左</button>
        <button class="btn" data-btn="right">右</button>
      </div>
    </div>
    <div class="dock">
      <button class="btn" data-key="Escape">Esc</button>
      <button class="btn" data-key="Tab">Tab</button>
      <button class="btn" data-key="Control">Ctrl</button>
      <button class="btn" data-key="Alt">Alt</button>
      <button class="btn" data-key="Meta">Win</button>
      <button class="btn" data-key="Enter">Enter</button>
      <button class="btn" data-key="Delete">Del</button>
    </div>
  </div>
</div>

<div class="overlay hidden" id="connectPanel">
  <div class="sheet">
    <h2>连接被控端</h2>
    <div class="field"><label>地址</label><input id="host" placeholder="192.168.1.10:8765"></div>
    <div class="field"><label>对方 PIN</label><input id="pin" maxlength="12"></div>
    <div class="actions">
      <button class="btn" id="btnCancel">取消</button>
      <button class="btn primary" id="btnGo">连接</button>
    </div>
  </div>
</div>

<div class="overlay hidden" id="keysPanel">
  <div class="sheet">
    <h2>键盘</h2>
    <textarea id="kbInput" rows="3" placeholder="输入文字后发送（支持中文）"></textarea>
    <div class="actions" style="margin:10px 0">
      <button class="btn primary" id="btnSendText">发送文字</button>
      <button class="btn" id="btnSendEnter">回车</button>
      <button class="btn" id="btnClearKb">清空</button>
    </div>
    <div id="keypad">
      <button class="btn" data-key="F1">F1</button><button class="btn" data-key="F5">F5</button>
      <button class="btn" data-key="ArrowLeft">←</button><button class="btn" data-key="ArrowUp">↑</button>
      <button class="btn" data-key="ArrowDown">↓</button><button class="btn" data-key="ArrowRight">→</button>
      <button class="btn" data-key="Backspace">⌫</button><button class="btn" data-key="Space">空格</button>
    </div>
    <div class="actions" style="margin-top:14px"><button class="btn primary" id="btnCloseKeys">关闭</button></div>
  </div>
</div>

<div class="toast" id="toast"></div>
<script>
(function(){
  const $=id=>document.getElementById(id);
  const canvas=$('screen'), ctx=canvas.getContext('2d'), stage=$('stage');
  if(matchMedia('(pointer:coarse)').matches) document.body.classList.add('touch');
  let ws=null, connected=false, screenW=1, screenH=1, peerTimer=null;

  function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2200);}
  function show(id){['screenHome','screenRemote'].forEach(s=>$(s).classList.toggle('active',s===id));}
  function send(o){if(ws&&ws.readyState===1)ws.send(JSON.stringify(o));}
  async function api(p){const r=await fetch(p);if(!r.ok)throw new Error(await r.text());return r.json();}

  async function loadPeers(){
    try{
      const st=await api('/api/status');
      $('hubDot').classList.add('on');
      $('hubTxt').textContent='注册中心 '+st.hub;
      const data=await api('/api/devices');
      const peers=data.devices||[];
      const list=$('peerList');
      if(!peers.length){list.innerHTML='<div class="empty">暂无在线设备。请确认 server 已启动并注册到同一 hub。</div>';return;}
      list.innerHTML='';
      peers.forEach(p=>{
        const el=document.createElement('div');
        el.className='peer';
        el.innerHTML='<div class="avatar">'+((p.name||'?')[0]||'?').toUpperCase()+'</div><div class="meta"><div class="name"></div><div class="addr"></div></div><div>›</div>';
        el.querySelector('.name').textContent=p.name||p.addr;
        el.querySelector('.addr').textContent=p.addr+(p.pin_set?' · 已设PIN':' · 未设PIN');
        el.onclick=()=>{$('host').value=p.addr;$('pin').value='';$('connectPanel').classList.remove('hidden');$('pin').focus();};
        list.appendChild(el);
      });
    }catch(e){
      $('hubDot').classList.remove('on');
      $('hubTxt').textContent='注册中心不可达';
      $('peerList').innerHTML='<div class="empty">无法连接注册中心：'+e.message+'</div>';
    }
  }

  function fit(){
    if(!screenW||!screenH)return;
    const s=Math.min(stage.clientWidth/screenW,stage.clientHeight/screenH);
    canvas.style.width=Math.floor(screenW*s)+'px';
    canvas.style.height=Math.floor(screenH*s)+'px';
  }
  window.addEventListener('resize',fit);

  function setConn(on,l){connected=on;$('remoteDot').classList.toggle('on',on);$('remoteStxt').textContent=l||(on?'已连接':'未连接');}

  function disconnect(){if(ws){try{ws.close()}catch(e){}}ws=null;connected=false;setConn(false);}

  function connect(host,pin){
    host=(host||'').trim(); if(!host){toast('请填写地址');return;}
    if(!/^https?:/i.test(host))host='http://'+host;
    const u=new URL(host);
    const url=(u.protocol==='https:'?'wss:':'ws:')+'//'+u.host+'/ws';
    if(ws){try{ws.close()}catch(e){}}
    show('screenRemote'); $('remoteTitle').textContent=u.host; setConn(false,'连接中…');
    ws=new WebSocket(url); ws.binaryType='arraybuffer';
    ws.onopen=()=>ws.send(JSON.stringify({type:'auth',pin}));
    ws.onmessage=ev=>{
      if(typeof ev.data==='string'){
        let m;try{m=JSON.parse(ev.data)}catch{return;}
        if(m.type==='auth'){
          if(m.ok){setConn(true,'已连接');toast('已连接');}
          else{setConn(false,'PIN 错误');toast('PIN 不正确');try{ws.close()}catch(e){}}
        }
        return;
      }
      createImageBitmap(new Blob([ev.data],{type:'image/jpeg'})).then(bmp=>{
        if(canvas.width!==bmp.width||canvas.height!==bmp.height){
          canvas.width=bmp.width;canvas.height=bmp.height;screenW=bmp.width;screenH=bmp.height;fit();
        }
        ctx.drawImage(bmp,0,0); bmp.close&&bmp.close();
      }).catch(()=>{});
    };
    ws.onclose=()=>setConn(false,'已断开');
    ws.onerror=()=>{toast('连接失败');setConn(false,'连接失败')};
  }

  function toRemote(e){
    const r=canvas.getBoundingClientRect();
    let x=(e.clientX-r.left)/r.width*screenW, y=(e.clientY-r.top)/r.height*screenH;
    return {x:Math.round(Math.max(0,Math.min(screenW-1,x))), y:Math.round(Math.max(0,Math.min(screenH-1,y)))};
  }
  let last=null,longT=null,moved=false;
  function down(e){
    if(!connected)return;
    if(e.target.closest&&e.target.closest('#mouseBtns'))return;
    e.preventDefault(); try{stage.setPointerCapture(e.pointerId)}catch(_){}
    const p=toRemote(e);last=p;moved=false;send({type:'move',x:p.x,y:p.y});
    if(e.pointerType==='touch'){
      longT=setTimeout(()=>{if(!moved&&connected){send({type:'button',button:'right',down:true});send({type:'button',button:'right',down:false});toast('右键');}},550);
    }else{
      send({type:'button',button:e.button===2?'right':'left',down:true});
    }
  }
  function move(e){
    if(!connected)return; if(e.target.closest&&e.target.closest('#mouseBtns'))return;
    e.preventDefault(); const p=toRemote(e); if(last&&(p.x!==last.x||p.y!==last.y))moved=true;
    send({type:'move',x:p.x,y:p.y}); last=p;
  }
  function up(e){
    if(!connected)return; e.preventDefault(); clearTimeout(longT);
    if(e.pointerType==='touch'){
      if(!moved){const p=toRemote(e);send({type:'move',x:p.x,y:p.y});send({type:'button',button:'left',down:true});send({type:'button',button:'left',down:false});}
    }else send({type:'button',button:e.button===2?'right':'left',down:false});
    try{stage.releasePointerCapture(e.pointerId)}catch(_){}
  }
  stage.addEventListener('pointerdown',down);
  stage.addEventListener('pointermove',move);
  stage.addEventListener('pointerup',up);
  stage.addEventListener('pointercancel',up);
  stage.addEventListener('contextmenu',e=>e.preventDefault());
  stage.addEventListener('wheel',e=>{if(!connected)return;e.preventDefault();send({type:'scroll',dx:Math.sign(e.deltaX),dy:Math.sign(e.deltaY)})},{passive:false});

  document.querySelectorAll('#mouseBtns .btn').forEach(b=>{
    const btn=b.dataset.btn;
    b.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();send({type:'button',button:btn,down:true})});
    b.addEventListener('pointerup',e=>{e.preventDefault();e.stopPropagation();send({type:'button',button:btn,down:false})});
  });
  document.querySelectorAll('[data-key]').forEach(b=>b.addEventListener('click',()=>{
    if(!connected){toast('未连接');return;}
    send({type:'key',key:b.dataset.key,down:true}); send({type:'key',key:b.dataset.key,down:false});
  }));

  const kb=$('kbInput');
  function sendText(s){if(!connected){toast('未连接');return;}if(!s)return;send({type:'text',text:s});toast('已发送');}
  $('btnSendText').onclick=()=>{sendText(kb.value);kb.value=''};
  $('btnSendEnter').onclick=()=>{send({type:'key',key:'Enter',down:true});send({type:'key',key:'Enter',down:false})};
  $('btnClearKb').onclick=()=>{kb.value=''};
  kb.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendText(kb.value);send({type:'key',key:'Enter',down:true});send({type:'key',key:'Enter',down:false});kb.value=''}});

  $('btnRefresh').onclick=loadPeers;
  $('btnManual').onclick=()=>{$('connectPanel').classList.remove('hidden');$('host').focus()};
  $('btnCancel').onclick=()=>$('connectPanel').classList.add('hidden');
  $('btnGo').onclick=()=>{$('connectPanel').classList.add('hidden');connect($('host').value,$('pin').value.trim())};
  $('btnBack').onclick=()=>{disconnect();show('screenHome');loadPeers()};
  $('btnDisc').onclick=()=>{disconnect();toast('已断开')};
  $('btnKeys').onclick=()=>{$('keysPanel').classList.remove('hidden');kb.focus()};
  $('btnCloseKeys').onclick=()=>$('keysPanel').classList.add('hidden');

  loadPeers();
  peerTimer=setInterval(loadPeers,4000);
})();
</script>
</body>
</html>
